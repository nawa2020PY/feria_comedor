<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{idToEdit != 0 ? "Usuario a Editar" : "Usuario Comedor"}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">


  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Usuario</ion-title>
        <ng-container *ngIf="!loadingData">
          <form [formGroup]="formDataUsuario" >
            <ion-item [class.invalid]="formDataUsuario.get('nombre')?.invalid && formDataUsuario.get('nombre')?.touched">
              <ion-label position="stacked">Usuario</ion-label>
              <ion-input formControlName="usuario" type="text"></ion-input>
            </ion-item>
            <ion-item>
              <ion-label position="stacked">Contraseña</ion-label>
              <ion-input formControlName="password" type="password"></ion-input>
            </ion-item>
            <ion-item>
              <ion-label position="stacked">Nombre</ion-label>
              <ion-input formControlName="nombre" type="text"></ion-input>
            </ion-item>
            <!-- TIPO USUARIO: 1 = Usuario Comedor, 2 Usuario RRHH
             -->
            <ion-item>
              <ion-label position="stacked">Tipo Usuario</ion-label>
              <ion-select formControlName="tipoUsuario" interface="action-sheet">
                <ion-select-option [value]="1">Usuario Comedor</ion-select-option>
                <ion-select-option [value]="2">Usuario RRHH</ion-select-option>
              </ion-select>
            </ion-item>
            <!-- idComedor -->
            <ion-item>
              <ion-label position="stacked">Comedor</ion-label>
              <ion-select formControlName="idComedor" interface="action-sheet">
                <ion-select-option *ngFor="let opcion of comedores" [value]="opcion.comedorID">
                  {{ opcion.nombre }}
                </ion-select-option>
              </ion-select>
            </ion-item>


            <ion-item>
              <ion-label position="stacked">Activo</ion-label>
              <ion-checkbox formControlName="activo"></ion-checkbox>
            </ion-item>

            <ion-button expand="full" type="submit" [disabled]="formDataUsuario.invalid" (click)="submitForm()">
              Guardar
            </ion-button>
          </form>
        </ng-container>
    
    </ion-toolbar>
  </ion-header>

</ion-content>
