<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ folder }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Empleados</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-card *ngFor="let item of data">
      <ion-card-header>
        <ion-card-title>{{ item.Nombre }}</ion-card-title>
        <ion-card-subtitle>{{ item.NroDocumento }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <div *ngFor="let key of keysToShow">
          <p>
            <strong>{{ key }}:</strong> {{ item[key] }}
          </p>
        </div>
        <!-- TODO:DESCOMENTAR CUANDO TENGA EDIT DE EMPLEADOS
         <p style="margin-top:16px">
          <ion-button (click)="edit(item.IDEmpleado)" expand="block" fill="outline" size="small" style="margin-top:16px;"><ion-icon  name="create-outline"></ion-icon><strong>Editar</strong></ion-button>
        </p> -->
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
